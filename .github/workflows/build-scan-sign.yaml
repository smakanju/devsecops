name: Build Scan Sign

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Build catalog image
        run: |
          mvn -f services/catalog/pom.xml package -DskipTests
          docker build -t public.ecr.aws/example/catalog:${{ github.sha }} services/catalog
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: public.ecr.aws/example/catalog:${{ github.sha }}
      - name: Install cosign
        uses: sigstore/cosign-installer@v3.5.0
      - name: Sign image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes public.ecr.aws/example/catalog:${{ github.sha }}

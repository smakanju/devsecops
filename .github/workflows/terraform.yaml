name: Terraform

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "platform/terraform/**"

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt
        run: terraform fmt -check -recursive platform/terraform
      - name: Terraform init
        run: terraform -chdir=platform/terraform/environments/dev init
      - name: Terraform plan
        run: terraform -chdir=platform/terraform/environments/dev plan
      - name: Checkov scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: platform/terraform

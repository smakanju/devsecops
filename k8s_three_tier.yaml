apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  labels:
    app: three-tier
stringData:
  POSTGRES_PASSWORD: devsecops
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  labels:
    app: three-tier
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: three-tier
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: three-tier
      tier: database
  template:
    metadata:
      labels:
        app: three-tier
        tier: database
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: three-tier
    tier: database
spec:
  selector:
    app: three-tier
    tier: database
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: three-tier
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: three-tier
      tier: backend
  template:
    metadata:
      labels:
        app: three-tier
        tier: backend
    spec:
      containers:
        - name: backend
          image: siddharth67/node-service:v1
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: DATABASE_HOST
              value: postgres
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: three-tier
    tier: backend
spec:
  selector:
    app: three-tier
    tier: backend
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: three-tier
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: three-tier
      tier: frontend
  template:
    metadata:
      labels:
        app: three-tier
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_URL
              value: http://backend:5000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: three-tier
    tier: frontend
spec:
  selector:
    app: three-tier
    tier: frontend
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer

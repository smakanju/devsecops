apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  labels:
    app.kubernetes.io/name: catalog
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog
    spec:
      containers:
        - name: catalog
          image: public.ecr.aws/example/catalog:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: CATALOG_DB_URL
              valueFrom:
                secretKeyRef:
                  name: catalog-db
                  key: jdbc-url
            - name: CATALOG_DB_USER
              valueFrom:
                secretKeyRef:
                  name: catalog-db
                  key: username
            - name: CATALOG_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalog-db
                  key: password
            - name: CATALOG_SECURITY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: catalog-auth
                  key: username
            - name: CATALOG_SECURITY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalog-auth
                  key: password
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
      securityContext:
        fsGroup: 1001

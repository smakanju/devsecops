apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: catalog
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
images:
  - name: public.ecr.aws/example/catalog
    newTag: prod
